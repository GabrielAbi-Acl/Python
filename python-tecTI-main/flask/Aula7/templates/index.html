<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Flask</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <h1>Calculadora Web</h1>

  <div id="calculator">
    <form method="POST" action="{{ url_for('index') }}">

      <div class="form-grupo" id="grupo-num1">
        <label for="num1" id="label-num1">Primeiro número</label>
        <input type="number" id="num1" name="num1" step="any" required
               value="{{ request.form.get('num1', '') }}">
      </div>

      <div class="form-grupo">
        <label for="operacao">Operação</label>
        {% set op = request.form.get('operacao', '+') %}
        <select id="operacao" name="operacao" required onchange="atualizarCampos()">
          <option value="+"       {% if op == '+'        %}selected{% endif %}>+ Adição</option>
          <option value="-"       {% if op == '-'        %}selected{% endif %}>− Subtração</option>
          <option value="*"       {% if op == '*'        %}selected{% endif %}>× Multiplicação</option>
          <option value="/"       {% if op == '/'        %}selected{% endif %}>÷ Divisão</option>
          <option value="**"      {% if op == '**'       %}selected{% endif %}>^ Potência</option>
          <option value="sqrt"    {% if op == 'sqrt'     %}selected{% endif %}>√ Raiz Quadrada</option>
          <option value="log"     {% if op == 'log'      %}selected{% endif %}>log Logaritmo (base 10)</option>
          <option value="bhaskara"{% if op == 'bhaskara' %}selected{% endif %}>Bhaskara (ax² + bx + c)</option>
        </select>
      </div>

      <div class="form-grupo" id="grupo-num2">
        <label for="num2">Segundo número</label>
        <input type="number" id="num2" name="num2" step="any"
               value="{{ request.form.get('num2', '') }}">
      </div>

      <div class="form-grupo" id="grupo-num3" style="display:none;">
        <label for="num3">Terceiro número (c)</label>
        <input type="number" id="num3" name="num3" step="any"
               value="{{ request.form.get('num3', '') }}">
      </div>

      <div id="legenda-bhaskara" class="legenda" style="display:none;">
        Preencha: <strong>a</strong> (1º campo), <strong>b</strong> (2º campo), <strong>c</strong> (3º campo)
      </div>

      <button type="submit">Calcular</button>
    </form>

    {% if etapas %}
    <div class="resultado">
      <strong>Resposta do servidor (Python):</strong>
      <div class="etapas">{{ etapas }}</div>
      <div class="valor-final">Resultado: {{ resultados }}</div>
    </div>
    {% endif %}

    <a href="{{ url_for('index') }}">↩ Limpar / nova conta</a>
  </div>

  <script>
    function atualizarCampos() {
      const op       = document.getElementById("operacao").value;
      const grupoN2  = document.getElementById("grupo-num2");
      const grupoN3  = document.getElementById("grupo-num3");
      const legenda  = document.getElementById("legenda-bhaskara");
      const num2     = document.getElementById("num2");
      const num3     = document.getElementById("num3");
      const labelN1  = document.getElementById("label-num1");

      const semN2    = ["sqrt", "log"];
      const bhaskara = op === "bhaskara";

      if (semN2.includes(op)) {
        grupoN2.style.display = "none";
        num2.required = false;
        num2.value = "";
      } else {
        grupoN2.style.display = "block";
        num2.required = !bhaskara; 
      }

      grupoN3.style.display  = bhaskara ? "block" : "none";
      legenda.style.display  = bhaskara ? "block" : "none";
      num3.required          = bhaskara;

      labelN1.textContent = bhaskara ? "Coeficiente a" : "Primeiro número";
      if (document.getElementById("num2").labels[0])
        document.getElementById("num2").labels[0].textContent = bhaskara ? "Coeficiente b" : "Segundo número";
    }

    atualizarCampos();
  </script>

</body>
</html>
